repro: "On a host whose Bash tool shell is zsh 5.9 with the user's aliases (alias | grep -c -E \"='?git \" gives 197, e.g. gc='git commit --verbose'): scan('gc -m x') is plain with argv ('gc','-m','x'), token_in(text,'commit') is False, and the shell runs git commit --verbose -m x with no gated commit. Also scan('=git commit') is plain with argv ('=git','commit') while zsh expands =python3 to /usr/bin/python3. Checked 2026-11-16: shellscan.scan at ede19ef gives plain=True and argv ('gc','-m','x') (source early-3b1-review-1.md:53-62)."
