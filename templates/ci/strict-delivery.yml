# strict-delivery: generated by python3 -m gates init; do not edit
name: strict-delivery

on:
  push:
    branches: [{{base_branch}}]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      - name: Fetch the framework
        run: |
          git init "$RUNNER_TEMP/strict-delivery"
          cd "$RUNNER_TEMP/strict-delivery"
          git fetch --depth 1 https://github.com/{{repository}} {{pin}}
          git checkout --detach FETCH_HEAD
      - name: Index the generated files
        working-directory: ${{ runner.temp }}/strict-delivery
        run: python3 -m gates index --root "$GITHUB_WORKSPACE"
      - name: Create the local base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/heads/$BASE_REF" > /dev/null || git branch "$BASE_REF" "origin/$BASE_REF"
      - name: Run the gates
        working-directory: ${{ runner.temp }}/strict-delivery
        run: python3 -m gates run_all --root "$GITHUB_WORKSPACE" --base origin/${{ github.event_name == 'pull_request' && github.base_ref || github.event.repository.default_branch }}
      # A pull request is also checked at its head sha, with every integration branch of a program present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create the local integration branches
        if: github.event_name == 'pull_request'
        run: |
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/*/integration'); do
            name="${ref#origin/}"
            git branch "$name" "$ref"
          done
      - name: Create the local base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/heads/$BASE_REF" > /dev/null || git branch "$BASE_REF" "origin/$BASE_REF"
      - name: Check the streams of the head branch
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/strict-delivery
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 -m gates check streams --root "$GITHUB_WORKSPACE" --branch "$HEAD_REF"
      # A cleanup/<plan> head is also judged by check cleanup; any other head skips the step.
      # A tail that names a program is a program close, checked by hand with --program and --decision.
      - name: Check the cleanup of a cleanup head
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/strict-delivery
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            cleanup/*) ;;
            *) exit 0 ;;
          esac
          PLAN="${HEAD_REF#cleanup/}"
          if python3 -c 'import sys; from gates.lib import programs; sys.exit(0 if programs.program_problem(sys.argv[1]) == "" else 1)' "$PLAN"; then
            echo "program close: check it by hand with check cleanup --program NAME --decision DEC"
            exit 0
          fi
          python3 -m gates check cleanup --root "$GITHUB_WORKSPACE" --plan="$PLAN"
