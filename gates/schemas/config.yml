kind: config
version: 2
format: yaml
files:
  - path: config
fields:
  schema:
    type: str
  framework_version:
    type: str
  profile:
    type: enum
    values:
      - light
      - standard
      - strict
  paths:
    type: map
    required: false
    fields:
      state:
        type: str
        required: false
      decisions:
        type: str
        required: false
      findings:
        type: str
        required: false
      claims:
        type: str
        required: false
      plan_state:
        type: str
        required: false
      programs:
        type: str
        required: false
      playbooks:
        type: str
        required: false
      receipts:
        type: str
        required: false
      context:
        type: str
        required: false
      architecture:
        type: str
        required: false
      index:
        type: str
        required: false
      specs:
        type: str
        required: false
      plans:
        type: str
        required: false
      reviews:
        type: str
        required: false
  ids:
    type: map
    required: false
    fields:
      decision:
        type: str
        required: false
      finding:
        type: str
        required: false
      claim:
        type: str
        required: false
      request:
        type: str
        required: false
  base_branch:
    type: str
    required: false
  decisions:
    type: map
    required: false
    fields:
      scan:
        type: list
        required: false
        items:
          type: glob
  decision_classes:
    type: map
    required: false
    fields:
      owner_only:
        type: list
        required: false
        min: 1
        items:
          type: str
  commands:
    type: any-map
    required: false
  models:
    type: any-map
    required: false
  roles:
    type: any-map
    required: false
  block:
    type: any-map
    required: false
  rulings:
    type: any-map
    required: false
  dispatch:
    type: any-map
    required: false
  budgets:
    type: any-map
    required: false
  drift:
    type: any-map
    required: false
  overrides:
    type: any-map
    required: false
  top_tier_roles:
    type: list
    required: false
    items:
      type: str
  top_tier_fallback:
    type: str
    required: false
  limits:
    type: map
    required: false
    fields:
      max_children:
        type: any-map
        required: false
      max_depth:
        type: int
        required: false
        min: 1
      max_concurrent:
        type: int
        required: false
        min: 1
  merge:
    type: map
    required: false
    fields:
      mode:
        type: enum
        required: false
        values:
          - host
          - controller
  escape_cost:
    type: map
    required: false
    fields:
      CRITICAL:
        type: int
        min: 0
      HIGH:
        type: int
        min: 0
      MEDIUM:
        type: int
        min: 0
      LOW:
        type: int
        min: 0
  reviews:
    type: map
    required: false
    fields:
      small:
        type: map
        required: false
        fields:
          max_lines:
            type: int
            required: false
            min: 1
          max_files:
            type: int
            required: false
            min: 1
          exclude:
            type: list
            required: false
            items:
              type: glob
          tier:
            type: enum
            required: false
            values:
              - tier1
              - tier2
              - tier3
              - tier4
  context:
    type: map
    required: false
    fields:
      max_lines:
        type: int
        required: false
        min: 1
      max_bytes:
        type: int
        required: false
        min: 1
