kind: merged-log
version: 1
format: markdown
files:
  - dir: programs
    glob: "*/merged.md"
first_line: "<!-- schema: merged-log/1 -->"
lines:
  - word: MERGED
    pattern: "MERGED pr=[1-9][0-9]{0,599} head=[0-9a-f]{40} merge=[0-9a-f]{40} merged_by=[!-~]+ at=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z final=(?:yes|no) stream=[a-z0-9][a-z0-9-]* block=[0-9A-Za-z]+ approval=(?:host|chat pr=[1-9][0-9]{0,599} head=[0-9a-f]{40} words= *[!-~][ -~]*)"
