name: strict-delivery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Task CI1: the full suite runs as parallel shards of the test modules (tests/ci_shards.py); the gates job below waits for all of them.
  shard:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.9", "3.13"]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m tests.ci_shards --shards 5 --index ${{ matrix.shard }}

  # Task CI1: always runs, so a failed, cancelled or skipped shard fails the gates check instead of leaving it skipped
  # (a skipped check counts as passed); its first step fails unless every shard job succeeded.
  gates:
    needs: shard
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.9", "3.13"]
    steps:
      - name: Require every shard
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          [ "$SHARD_RESULT" = success ] || { echo "the shard jobs did not all succeed (result: $SHARD_RESULT)" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m gates index
      - name: Create the local base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/heads/$BASE_REF" > /dev/null || git branch "$BASE_REF" "origin/$BASE_REF"
      - run: python -m gates run_all --base origin/${{ github.event_name == 'pull_request' && github.base_ref || github.event.repository.default_branch }}

  # Task P3.1: a pull request is also checked at its head sha, with every integration branch of a program present.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Create the local integration branches
        run: |
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/*/integration'); do
            name="${ref#origin/}"
            git branch "$name" "$ref"
          done
      - name: Create the local base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/heads/$BASE_REF" > /dev/null || git branch "$BASE_REF" "origin/$BASE_REF"
      - name: Check the streams of the head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python -m gates check streams --branch "$HEAD_REF"
      # Task P3.3: a cleanup/<plan> head is also judged by check cleanup; any other head skips the step.
      # A tail that names a program is a program close, checked by hand with --program and --decision.
      - name: Check the cleanup of a cleanup head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            cleanup/*) ;;
            *) exit 0 ;;
          esac
          PLAN="${HEAD_REF#cleanup/}"
          if python -c 'import sys; from gates.lib import programs; sys.exit(0 if programs.program_problem(sys.argv[1]) == "" else 1)' "$PLAN"; then
            echo "program close: check it by hand with check cleanup --program NAME --decision DEC"
            exit 0
          fi
          python -m gates check cleanup --plan="$PLAN"

  # Task CI3: the mutation tests of a pull request run here once per head, from the tables the pull request adds or changes
  # (.strict-delivery/mutants/<task-id>.py, read by tests/ci_mutants.py), split over four jobs; mutants-summary collects them.
  mutants-1:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      lines: ${{ steps.run.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      - id: py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - id: run
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: python -m tests.ci_mutants run --base "origin/$BASE_REF" --head "$HEAD_SHA" --parts 4 --part 1 --python "3.9=$PY39" --python "3.13=$PY313"

  mutants-2:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      lines: ${{ steps.run.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      - id: py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - id: run
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: python -m tests.ci_mutants run --base "origin/$BASE_REF" --head "$HEAD_SHA" --parts 4 --part 2 --python "3.9=$PY39" --python "3.13=$PY313"

  mutants-3:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      lines: ${{ steps.run.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      - id: py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - id: run
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: python -m tests.ci_mutants run --base "origin/$BASE_REF" --head "$HEAD_SHA" --parts 4 --part 3 --python "3.9=$PY39" --python "3.13=$PY313"

  mutants-4:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      lines: ${{ steps.run.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      - id: py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - id: run
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: python -m tests.ci_mutants run --base "origin/$BASE_REF" --head "$HEAD_SHA" --parts 4 --part 4 --python "3.9=$PY39" --python "3.13=$PY313"

  # Task CI3: always runs on a pull request, so a failed, cancelled or skipped mutation job fails it; it reads every job's
  # result and lines (job outputs) and fails on any NOT_APPLIED, TIMEOUT, ERROR, baseline failure or missing, duplicated or
  # unknown line, and lists the survivors without failing on them.
  mutants-summary:
    needs: [mutants-1, mutants-2, mutants-3, mutants-4]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTANT_RESULT_1: ${{ needs.mutants-1.result }}
          MUTANT_RESULT_2: ${{ needs.mutants-2.result }}
          MUTANT_RESULT_3: ${{ needs.mutants-3.result }}
          MUTANT_RESULT_4: ${{ needs.mutants-4.result }}
          MUTANT_LINES_1: ${{ needs.mutants-1.outputs.lines }}
          MUTANT_LINES_2: ${{ needs.mutants-2.outputs.lines }}
          MUTANT_LINES_3: ${{ needs.mutants-3.outputs.lines }}
          MUTANT_LINES_4: ${{ needs.mutants-4.outputs.lines }}
        run: python -m tests.ci_mutants summary --base "origin/$BASE_REF" --head "$HEAD_SHA" --parts 4
